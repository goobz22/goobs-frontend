# CI for the story+JSDoc program (docs/audits/story-jsdoc-standard-proposal.md §4.5).
# Regression gates include unit tests, browser checks and Storybook plays:
#   typecheck (root + stories) → lint:all (oxlint, stylelint, story rules,
#   coverage, contract guards and unit tests) → library build → browser tests →
#   storybook build → Chromatic visual regression.
#
# CHROMATIC_PROJECT_TOKEN must be set in the repo's Actions secrets (owner
# action — get it from chromatic.com project settings). Until the secret
# exists, the chromatic step is skipped rather than failing the whole run.
name: ci

on:
  push:
    branches: [production]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Chromatic needs full history to find its baseline ancestor.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit production dependency graph
        run: bun run audit:production

      - name: Typecheck (library + stories)
        run: bun run typecheck

      - name: Lint, contract guards and unit tests
        run: bun run lint:all

      - name: Build library
        run: bun run build

      - name: Install browser for runtime regressions
        run: bunx playwright install --with-deps chromium

      - name: Component browser regressions and severity Storybook interactions
        run: bun run test:browser

      - name: Build Storybook
        run: bun run build-storybook

      - name: Chromatic visual regression
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: bunx chromatic --storybook-build-dir storybook-static --exit-zero-on-changes
